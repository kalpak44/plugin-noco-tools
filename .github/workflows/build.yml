name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '**.md'
  workflow_dispatch: { }

# Read-only by default. The release step is the only thing that needs write
# access, so it asks for it at the job level instead of every step in this
# workflow running with a token that can push to the repository.
permissions:
  contents: read

jobs:
  tarball:
    name: build .tgz
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # required by the release step on tag pushes
    steps:
      # Actions are pinned to commit SHAs, not floating tags: a tag is mutable,
      # so `@v4` is an unverifiable build input (CWE-829). Dependabot's
      # github-actions ecosystem keeps these current — see dependabot.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install NocoBase CLI globally
        run: npm i -g @nocobase/cli

      - name: Cache local dev app
        id: cache-app
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # build.sh short-circuits the `nb source download` step when
          # app/source/package.json is already there; the plugin dir is always
          # rsynced fresh so a stale plugin copy isn't a risk.
          path: app/source
          key: nocobase-source-${{ runner.os }}-v5-${{ hashFiles('package.json', 'scripts/build.sh') }}
          restore-keys: |
            nocobase-source-${{ runner.os }}-v5-

      - name: Build .tgz
        run: npm run build

      - name: Inspect artifact
        run: |
          ls -la dist/
          tar tzf dist/*.tgz | head -30
          echo "---package.json inside tgz---"
          tar xOzf dist/*.tgz package/package.json

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-tgz
          path: dist/*.tgz
          if-no-files-found: error

      - name: Attach to release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.tgz
